
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Beauty Assistant | Personalized Beauty Analysis</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #f97360;
      --dark: #20302f;
      --muted: #687775;
      --line: #dbe5e2;
      --paper: #fffdf9;
      --wash: #f3f7f4;
      --danger: #c2413b;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background: radial-gradient(circle at 15% 0%, #fff5e8 0, transparent 32rem), var(--wash);
      color: var(--dark);
      line-height: 1.6;
    }
    
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 3.5rem 2rem 1rem;
    }
    
    header {
      max-width: 720px;
      margin: 0 auto 2.5rem;
      text-align: center;
    }

    header::before {
      content: "PERSONAL CARE / AI STUDIO";
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
    }
    
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.3rem, 5vw, 4.2rem);
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 1rem;
      color: var(--dark);
    }
    
    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
    }
    
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 18px 45px rgba(32, 48, 47, 0.08);
      padding: clamp(1.25rem, 4vw, 2.5rem);
      margin-bottom: 2rem;
    }
    
    .card-title {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--dark);
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .card-title i {
      font-size: 1.3rem;
    }
    
    .media-container {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    
    .media-box {
      flex: 1;
      min-width: 300px;
    }

    .camera-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fbf9;
    }

    .camera-status {
      padding: 0.8rem 1rem;
      border-radius: 8px;
      background: #e8f2ef;
      color: var(--primary-dark);
      font-size: 0.9rem;
    }

    .camera-status.error {
      background: #fff0ee;
      color: var(--danger);
    }

    video {
      background: #20302f;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }
    
    video, canvas, img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(32, 48, 47, 0.12);
    }
    
    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 0;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    
    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(15, 118, 110, 0.22);
    }
    
    .btn-secondary {
      background: var(--paper);
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    
    .btn-secondary:hover {
      background: var(--primary);
      color: white;
    }

    .btn:focus-visible,
    .file-input label:focus-within {
      outline: 3px solid rgba(249, 115, 96, 0.35);
      outline-offset: 3px;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
      box-shadow: none;
    }
    
    .btn-warning {
      background: #f2c14e;
      color: var(--dark);
    }
    
    .btn-warning:hover {
      background: #e6b800;
    }
    
    #previewSection {
      margin-top: 1.5rem;
      display: none;
    }
    
    #uploadForm {
      margin-top: 2rem;
    }
    
    .file-input {
      position: relative;
      margin-bottom: 1rem;
    }
    
    .file-input input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      cursor: pointer;
    }
    
    .file-input label {
      display: block;
      padding: 1.5rem;
      border: 1px dashed #9db3ae;
      border-radius: 8px;
      background: rgba(255, 253, 249, 0.72);
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .file-input label:hover {
      border-color: var(--primary);
      background: #eaf4f1;
    }
    
    .file-input i {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    
    #results {
      margin-top: 2rem;
      animation: fadeIn 0.5s ease;
    }
    
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 1.5rem;
    }
    
    .result-card {
      background: #f8fbf9;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: none;
    }
    
    .result-card h4 {
      color: var(--primary-dark);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .result-card ul {
      list-style-type: none;
    }
    
    .result-card li {
      margin-bottom: 0.8rem;
      padding-left: 1.5rem;
      position: relative;
    }
    
    .result-card li:before {
      content: "•";
      color: var(--accent);
      font-size: 1.5rem;
      position: absolute;
      left: 0;
      top: -0.3rem;
    }
    
    .attribute {
      font-weight: 600;
      color: var(--dark);
    }
    
    .value {
      color: #555;
    }
    
    .suggestion {
      background: #eaf4f1;
      padding: 0.8rem;
      border-radius: 8px;
      margin-bottom: 0.8rem;
      border-left: 4px solid var(--primary);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    footer {
      text-align: center;
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    
    @media (max-width: 768px) {
      .media-container {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 2rem 1rem 1rem;
      }

      .btn-group .btn {
        flex: 1 1 auto;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Beauty Assistant</h1>
      <p class="subtitle">Get personalized beauty analysis and grooming suggestions powered by AI</p>
    </header>
    
    <div class="card">
      <h2 class="card-title"><i class="fas fa-camera"></i> Upload or Capture Image</h2>
      
      <div class="media-container">
        <div class="media-box camera-panel">
          <video id="video" autoplay></video>
          <div id="cameraStatus" class="camera-status">Camera is off. Select Start camera to begin.</div>
          <div class="btn-group">
            <button id="startCamera" type="button" class="btn btn-primary">
              <i class="fas fa-video"></i> Start camera
            </button>
            <button id="capture" type="button" class="btn btn-primary" disabled>
              <i class="fas fa-camera"></i> Capture
            </button>
            <button id="retake" type="button" class="btn btn-secondary" style="display: none;">
              <i class="fas fa-redo"></i> Retake
            </button>
          </div>
        </div>
        
        <div class="media-box" id="previewSection" style="display: none;">
          <h4><i class="fas fa-image"></i> Captured Preview</h4>
          <img id="previewImage" />
        </div>
      </div>
      
      <div class="file-input">
        <input type="file" name="image" id="imageInput" accept="image/*">
        <label for="imageInput">
          <i class="fas fa-cloud-upload-alt"></i>
          <h4>Or Upload an Image</h4>
          <p>Drag & drop or click to browse</p>
        </label>
      </div>
      
      <form id="uploadForm" enctype="multipart/form-data">
        <input type="hidden" name="captured" id="capturedImage">
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <i class="fas fa-magic"></i> Analyze My Beauty Profile
        </button>
      </form>
    </div>
    
    <div id="results"></div>
    
    <canvas id="canvas" style="display:none;"></canvas>
  </div>
  
  <footer>
    <p>© 2023 AI Beauty Assistant | Powered by Advanced Computer Vision</p>
  </footer>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture');
    const startCameraBtn = document.getElementById('startCamera');
    const retakeBtn = document.getElementById('retake');
    const capturedImageInput = document.getElementById('capturedImage');
    const imageInput = document.getElementById('imageInput');
    const previewSection = document.getElementById('previewSection');
    const previewImage = document.getElementById('previewImage');
    const uploadForm = document.getElementById('uploadForm');
    const resultsDiv = document.getElementById('results');
    const cameraStatus = document.getElementById('cameraStatus');
    let cameraStream = null;

    // Set canvas dimensions
    canvas.width = 640;
    canvas.height = 480;

    function setCameraStatus(message, isError = false) {
      cameraStatus.textContent = message;
      cameraStatus.classList.toggle('error', isError);
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setCameraStatus('Camera access requires HTTPS or localhost. Upload an image instead.', true);
        return;
      }

      startCameraBtn.disabled = true;
      setCameraStatus('Requesting camera permission...');

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
          audio: false
        });
        video.srcObject = cameraStream;
        await video.play();
        captureBtn.disabled = false;
        startCameraBtn.textContent = 'Camera ready';
        setCameraStatus('Camera ready. Position your face and select Capture.');
      } catch (error) {
        console.error('Webcam not accessible', error);
        startCameraBtn.disabled = false;
        const message = error.name === 'NotAllowedError'
          ? 'Camera permission was denied. Allow camera access in your browser, then try again.'
          : 'No usable camera was found. You can upload an image instead.';
        setCameraStatus(message, true);
      }
    }

    startCameraBtn.addEventListener('click', startCamera);

    // Capture webcam photo
    captureBtn.onclick = () => {
      if (!cameraStream || video.videoWidth === 0 || video.videoHeight === 0) {
        setCameraStatus('The camera is not ready yet. Start the camera and try again.', true);
        return;
      }
      const context = canvas.getContext('2d');
      // Set canvas dimensions to match video aspect ratio
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // Convert to JPEG with quality 0.8
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      capturedImageInput.value = dataUrl;

      previewImage.src = dataUrl;
      previewSection.style.display = "block";
      video.style.display = "none";
      retakeBtn.style.display = "inline-block";
      imageInput.value = "";
      setCameraStatus('Preview ready. Select Analyze My Beauty Profile or Retake.');
    };

    // Retake photo
    retakeBtn.onclick = () => {
      capturedImageInput.value = "";
      previewSection.style.display = "none";
      video.style.display = "block";
      retakeBtn.style.display = "none";
      setCameraStatus('Camera ready. Position your face and select Capture.');
    };

    // Handle file selection
    imageInput.addEventListener('change', function() {
      if (this.files && this.files[0]) {
        capturedImageInput.value = "";
        previewImage.src = URL.createObjectURL(this.files[0]);
        previewSection.style.display = "block";
        video.style.display = "none";
        retakeBtn.style.display = "inline-block";
        setCameraStatus('Image selected. Select Analyze My Beauty Profile to continue.');
      }
    });

    // Submit handler
    uploadForm.onsubmit = async function (e) {
      e.preventDefault();
      const formData = new FormData();
      let hasImage = false;

      // Show loading state
      const submitBtn = uploadForm.querySelector('button[type="submit"]');
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';
      submitBtn.disabled = true;

      if (capturedImageInput.value) {
        const blob = await (await fetch(capturedImageInput.value)).blob();
        formData.append("image", blob, "webcam_capture.jpg");
        hasImage = true;
      } else if (imageInput.files.length > 0) {
        formData.append("image", imageInput.files[0]);
        hasImage = true;
      }

      if (!hasImage) {
        alert("Please select or capture an image.");
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
        return;
      }

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Unable to analyze this image.');
        }
        
        resultsDiv.innerHTML = `
          <div class="card">
            <h2 class="card-title"><i class="fas fa-chart-line"></i> Your Beauty Analysis</h2>
            <p>Here's your personalized beauty profile and recommendations:</p>
            
            <div class="results-grid">
              <div class="result-card">
                <h4><i class="fas fa-user"></i> Attributes</h4>
                <ul>
                  <li><span class="attribute">Face Shape:</span> <span class="value">${data.attributes.face_shape}</span></li>
                  <li><span class="attribute">Gender:</span> <span class="value">${data.attributes.gender}</span></li>
                  <li><span class="attribute">Hair Type:</span> <span class="value">${data.attributes.hair_type}</span></li>
                  <li><span class="attribute">Skin Type:</span> <span class="value">${data.attributes.skin_type}</span></li>
                </ul>
              </div>
              
              <div class="result-card">
                <h4><i class="fas fa-lightbulb"></i> Recommendations</h4>
                <div class="suggestion">${data.suggestions.face_shape}</div>
                <div class="suggestion">${data.suggestions.gender}</div>
                <div class="suggestion">${data.suggestions.hair_type}</div>
                <div class="suggestion">${data.suggestions.skin_type}</div>
              </div>
            </div>
          </div>
        `;
      } catch (error) {
        console.error('Error:', error);
        resultsDiv.innerHTML = `
          <div class="card">
            <h2 class="card-title"><i class="fas fa-exclamation-triangle"></i> Error</h2>
            <p>There was an error processing your image. Please try again.</p>
            <p>${error.message}</p>
          </div>
        `;
      } finally {
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
      }
    };

    // Drag and drop functionality
    const fileInputLabel = document.querySelector('.file-input label');
    
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      fileInputLabel.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      fileInputLabel.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      fileInputLabel.addEventListener(eventName, unhighlight, false);
    });

    function highlight() {
      fileInputLabel.style.borderColor = 'var(--primary)';
      fileInputLabel.style.backgroundColor = '#eaf4f1';
    }

    function unhighlight() {
      fileInputLabel.style.borderColor = '#ccc';
      fileInputLabel.style.backgroundColor = '';
    }

    fileInputLabel.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;
      
      if (files.length) {
        imageInput.files = files;
        const event = new Event('change');
        imageInput.dispatchEvent(event);
      }
    }
  </script>
</body>
</html>
